<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DELTA GREEN // THE PROGRAM - OPERATION BOARD</title>
    <style>
        :root {
            --dg-bg: #0b120e;
            --dg-panel: #111a14;
            --dg-border: #1e3324;
            --dg-green: #33ff66;
            --dg-dim-green: #1a8c3e;
            --dg-alert: #ff3333;
            --polaroid-bg: #e6e2d3;
            --shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--dg-bg);
            user-select: none;
        }

        /* Cabecera Clasificada Delta Green */
        #top-classification {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: #000;
            color: var(--dg-alert);
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 3px;
            padding: 4px 0;
            z-index: 1001;
            border-bottom: 1px solid #400;
            box-shadow: 0 2px 10px rgba(255,0,0,0.2);
        }

        #toolbar {
            position: absolute;
            top: 28px;
            left: 15px;
            z-index: 1000;
            background: rgba(11, 18, 14, 0.95);
            padding: 10px 15px;
            border-radius: 3px;
            border: 1px solid var(--dg-dim-green);
            color: var(--dg-green);
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
            flex-wrap: wrap;
        }

        #toolbar button, #toolbar label, #toolbar input[type="text"] {
            background: #142218;
            color: var(--dg-green);
            border: 1px solid var(--dg-dim-green);
            padding: 6px 12px;
            border-radius: 2px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            box-shadow: inset 0 0 5px rgba(51,255,102,0.1);
        }

        #toolbar input[type="text"] {
            background: #050a07;
            cursor: text;
            width: 160px;
            color: #ffcc00;
            letter-spacing: 1px;
            border-color: #554400;
        }

        #toolbar button:hover, #toolbar label:hover {
            background: var(--dg-dim-green);
            color: #fff;
        }

        #board {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #1a261e;
            background-image: radial-gradient(rgba(51,255,102,0.05) 15%, transparent 16%),
                              radial-gradient(rgba(0,0,0,0.4) 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            overflow: hidden;
            cursor: grab;
        }

        #board:active {
            cursor: grabbing;
        }

        .board-container {
            position: absolute;
            width: 6000px;
            height: 6000px;
            transform-origin: 0 0;
        }

        #string-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 6000px;
            height: 6000px;
            pointer-events: none;
            z-index: 10;
        }

        /* Ficha de Expediente de Individuo */
        .individual-card {
            position: absolute;
            width: 230px;
            background: var(--polaroid-bg);
            padding: 10px 10px 15px 10px;
            box-shadow: var(--shadow);
            border-radius: 2px;
            transition: box-shadow 0.2s ease;
            z-index: 20;
            border: 1px solid #b5aca0;
        }

        .individual-card:hover {
            z-index: 100;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }

        .pin {
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.7), inset 2px 2px 3px rgba(255,255,255,0.7);
            z-index: 30;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .pin:hover { transform: translateX(-50%) scale(1.2); }
        .pin.red { background: radial-gradient(circle at 30% 30%, #ff4d4d, #800000); }
        .pin.blue { background: radial-gradient(circle at 30% 30%, #4d94ff, #002266); }
        .pin.yellow { background: radial-gradient(circle at 30% 30%, #ffea4d, #998800); }
        
        /* Animación de chincheta seleccionada para conectar */
        .pin.pulsing {
            animation: pulse-pin 0.8s infinite alternate;
        }
        @keyframes pulse-pin {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 5px #33ff66; }
            100% { transform: translateX(-50%) scale(1.4); box-shadow: 0 0 15px #33ff66; }
        }

        .delete-card-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #800000;
            color: #fff;
            border: none;
            width: 18px;
            height: 18px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 35;
        }
        .delete-card-btn:hover { background: #ff3333; }

        .pin-color-selector {
            position: absolute;
            top: 5px;
            left: 5px;
            display: flex;
            gap: 3px;
            z-index: 35;
        }
        .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid #000;
        }
        .color-dot.red { background: #ff4d4d; }
        .color-dot.blue { background: #4d94ff; }
        .color-dot.yellow { background: #ffea4d; }

        .individual-img-container {
            width: 100%;
            height: 140px;
            background: #111;
            overflow: hidden;
            border: 1px solid #555;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 10px;
            text-align: center;
            cursor: pointer;
        }

        .individual-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(0.4) contrast(1.2) sepia(0.2);
        }

        .editable-field {
            border: 1px dashed transparent;
            background: transparent;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
            color: inherit;
        }

        .editable-field:hover, .editable-field:focus {
            border-color: #800;
            background: rgba(255,255,255,0.85);
            outline: none;
        }

        .individual-info h3 input {
            font-size: 13px;
            font-weight: bold;
            color: #111;
            border-bottom: 1px dashed #999;
            margin-bottom: 4px;
        }

        .individual-role input {
            font-size: 10px;
            color: #900;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .individual-desc textarea {
            font-size: 10px;
            color: #222;
            line-height: 1.25;
            resize: vertical;
            height: 45px;
            background: transparent;
        }

        .mode-indicator {
            font-size: 11px;
            color: #ffcc00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="top-classification">EYES ONLY // THE PROGRAM // AUTHORIZED DELTA GREEN AGENTS ONLY // CLASSIFIED TOP SECRET</div>

    <div id="toolbar">
        <div>
            <label>OPERACIÓN:</label>
            <input type="text" id="op-name" value="OPERATION-STYX">
        </div>
        <button onclick="saveOperation()">💾 Guardar Op.</button>
        <button onclick="loadOperation()">📂 Cargar Op.</button>
        <button onclick="toggleMode()">Modo: <span id="mode-name">Mover</span></button>
        <button onclick="addNewCard()">➕ Añadir Individuo</button>
        <button onclick="clearConnections()">Limpiar Hilos</button>
        <span class="mode-indicator" id="instruction-text">Tablero listo. (Arrastra el fondo para moverte)</span>
    </div>

    <div id="board" id="board-viewport">
        <div class="board-container" id="board-container">
            <canvas id="string-canvas" width="6000" height="6000"></canvas>
        </div>
    </div>

    <script>
        let individuals = [];
        let connections = []; 
        let mode = 'move'; 
        let connectingSource = null;

        // Variables de navegación (Pan & Zoom)
        let panX = 100;
        let panY = 80;
        let isPanning = false;
        let startPanX, startPanY;

        const board = document.getElementById('board');
        const container = document.getElementById('board-container');

        function updateTransform() {
            container.style.transform = `translate(${panX}px, ${panY}px)`;
        }

        // Lógica de desplazamiento por el tablero (Panning)
        board.addEventListener('mousedown', (e) => {
            if (e.target === board || e.target === document.getElementById('string-canvas') || e.target === container) {
                isPanning = true;
                startPanX = e.clientX - panX;
                startPanY = e.clientY - panY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startPanX;
                panY = e.clientY - startPanY;
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
        });

        function initBoard() {
            const currentOp = document.getElementById('op-name').value;
            const savedData = localStorage.getItem('dg_op_' + currentOp);
            
            if (savedData) {
                const parsed = JSON.parse(savedData);
                individuals = parsed.individuals || parsed.suspects || [];
                connections = parsed.connections || [];
            } else {
                individuals = [
                    { id: 1, name: "Dr. Victor March", role: "MÉDICO FORENSE", desc: "Realizó la autopsia no oficial en OMAHA. Muy nervioso.", x: 250, y: 150, pin: "red", img: "" },
                    { id: 2, name: "Sarah Miller", role: "ESPOSA (VÍNCULO)", desc: "Empieza a sospecher de las ausencias prolongadas del agente.", x: 550, y: 200, pin: "blue", img: "" }
                ];
                connections = [{ from: 1, to: 2 }];
            }
            updateTransform();
            renderBoard();
            drawStrings();
        }

        function renderBoard() {
            // Limpiamos tarjetas antiguas manteniendo el canvas
            const canvas = document.getElementById('string-canvas');
            document.querySelectorAll('.individual-card').forEach(el => el.remove());

            individuals.forEach(ind => {
                const card = document.createElement('div');
                card.className = 'individual-card';
                card.style.left = ind.x + 'px';
                card.style.top = ind.y + 'px';
                card.dataset.id = ind.id;

                const isPulsing = (connectingSource === ind.id) ? 'pulsing' : '';

                card.innerHTML = `
                    <div class="pin-color-selector">
                        <div class="color-dot red" onclick="setPinColor(${ind.id}, 'red')" title="Chincheta Roja"></div>
                        <div class="color-dot blue" onclick="setPinColor(${ind.id}, 'blue')" title="Chincheta Azul"></div>
                        <div class="color-dot yellow" onclick="setPinColor(${ind.id}, 'yellow')" title="Chincheta Amarilla"></div>
                    </div>
                    <button class="delete-card-btn" onclick="deleteCard(${ind.id})" title="Eliminar expediente">✕</button>
                    <div class="pin ${ind.pin || 'red'} ${isPulsing}" onclick="handlePinClick(event, ${ind.id})" title="Clic para tender/cortar hilo"></div>
                    <div class="individual-img-container" onclick="changeImage(${ind.id})" title="Clic para añadir URL de foto">
                        ${ind.img ? `<img src="${ind.img}" alt="Dossier">` : '<span>[ FOTO - AÑADIR URL ]</span>'}
                    </div>
                    <div class="individual-info">
                        <h3><input type="text" class="editable-field" value="${ind.name}" onchange="updateField(${ind.id}, 'name', this.value)"></h3>
                        <div class="individual-role"><input type="text" class="editable-field" value="${ind.role}" onchange="updateField(${ind.id}, 'role', this.value)"></div>
                        <div class="individual-desc"><textarea class="editable-field" onchange="updateField(${ind.id}, 'desc', this.value)">${ind.desc}</textarea></div>
                    </div>
                `;

                let isDraggingCard = false;
                let startX, startY;

                card.addEventListener('mousedown', (e) => {
                    if (mode !== 'move' || e.target.classList.contains('editable-field') || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.classList.contains('pin') || e.target.classList.contains('color-dot') || e.target.classList.contains('delete-card-btn')) return;
                    isDraggingCard = true;
                    startX = e.clientX - (ind.x + panX);
                    startY = e.clientY - (ind.y + panY);
                    card.style.zIndex = 1000;
                    e.stopPropagation();
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDraggingCard) return;
                    ind.x = (e.clientX - startX) - panX;
                    ind.y = (e.clientY - startY) - panY;
                    card.style.left = ind.x + 'px';
                    card.style.top = ind.y + 'px';
                    drawStrings();
                });

                window.addEventListener('mouseup', () => {
                    isDraggingCard = false;
                });

                container.appendChild(card);
            });
        }

        function updateField(id, field, value) {
            const item = individuals.find(i => i.id === id);
            if (item) item[field] = value;
        }

        function setPinColor(id, color) {
            const item = individuals.find(i => i.id === id);
            if (item) {
                item.pin = color;
                renderBoard();
            }
        }

        function deleteCard(id) {
            if (confirm("¿Destruir este expediente de inteligencia?")) {
                individuals = individuals.filter(i => i.id !== id);
                connections = connections.filter(c => c.from !== id && c.to !== id);
                renderBoard();
                drawStrings();
            }
        }

        function changeImage(id) {
            const item = individuals.find(i => i.id === id);
            const newUrl = prompt("Introduce la URL de la imagen del individuo:", item.img || "");
            if (newUrl !== null) {
                item.img = newUrl;
                renderBoard();
            }
        }

        function addNewCard() {
            const newId = individuals.length > 0 ? Math.max(...individuals.map(i => i.id)) + 1 : 1;
            individuals.push({
                id: newId,
                name: "NUEVO EXPEDIENTE",
                role: "CONTACTO / VÍNCULO",
                desc: "Notas de inteligencia clasificada...",
                x: 100 - panX + (window.innerWidth / 2),
                y: 100 - panY + (window.innerHeight / 2),
                pin: "red",
                img: ""
            });
            renderBoard();
        }

        function drawStrings() {
            const canvas = document.getElementById('string-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#b22222'; 
            ctx.lineWidth = 2.5;
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 6;

            connections.forEach(conn => {
                const fromInd = individuals.find(i => i.id === conn.from);
                const toInd = individuals.find(i => i.id === conn.to);

                if (fromInd && toInd) {
                    const x1 = fromInd.x + 115; 
                    const y1 = fromInd.y + 10;
                    const x2 = toInd.x + 115;
                    const y2 = toInd.y + 10;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    let cx = (x1 + x2) / 2 + 10;
                    let cy = (y1 + y2) / 2 + 10;
                    ctx.quadraticCurveTo(cx, cy, x2, y2);
                    ctx.stroke();
                }
            });
        }

        function toggleMode() {
            if (mode === 'move') {
                mode = 'connect';
                document.getElementById('mode-name').innerText = 'Conectar / Cortar Hilo';
                document.getElementById('instruction-text').innerText = 'Haz clic en dos chinchetas para tender hilo, o haz clic en un hilo existente para cortarlo.';
            } else {
                mode = 'move';
                document.getElementById('mode-name').innerText = 'Mover';
                document.getElementById('instruction-text').innerText = 'Tablero listo. (Arrastra el fondo para moverte)';
                connectingSource = null;
                renderBoard();
            }
        }

        function handlePinClick(e, id) {
            if (mode === 'connect') {
                e.stopPropagation();
                if (connectingSource === null) {
                    connectingSource = id;
                    renderBoard(); // Para activar la animación de pulso
                } else {
                    if (connectingSource !== id) {
                        // Comprobar si ya existe la conexión para evitar duplicados exactos
                        const exists = connections.some(c => (c.from === connectingSource && c.to === id) || (c.from === id && c.to === connectingSource));
                        if (!exists) {
                            connections.push({ from: connectingSource, to: id });
                        }
                    }
                    connectingSource = null;
                    renderBoard();
                    drawStrings();
                }
            }
        }

        // Detectar clics en el canvas de hilos para eliminarlos individualmente en modo conectar
        document.getElementById('board').addEventListener('click', (e) => {
            if (mode === 'connect' && (e.target === document.getElementById('string-canvas') || e.target === container)) {
                // Obtenemos coordenadas relativas al canvas
                const rect = container.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                // Comprobar cercanía a algún hilo para borrarlo
                for (let i = connections.length - 1; i >= 0; i--) {
                    const conn = connections[i];
                    const fromInd = individuals.find(ind => ind.id === conn.from);
                    const toInd = individuals.find(ind => ind.id === conn.to);
                    if (fromInd && toInd) {
                        const x1 = fromInd.x + 115, y1 = fromInd.y + 10;
                        const x2 = toInd.x + 115, y2 = toInd.y + 10;
                        const midX = (x1 + x2) / 2 + 10;
                        const midY = (y1 + y2) / 2 + 10;
                        
                        // Simple comprobación de distancia al punto medio de la curva
                        const dist = Math.hypot(clickX - midX, clickY - midY);
                        if (dist < 30) {
                            if (confirm("¿Cortar este hilo de investigación?")) {
                                connections.splice(i, 1);
                                drawStrings();
                                break;
                            }
                        }
                    }
                }
            }
        });

        function clearConnections() {
            if (confirm("¿Desconectar todos los hilos de inteligencia del tablero?")) {
                connections = [];
                drawStrings();
            }
        }

        function saveOperation() {
            const opName = document.getElementById('op-name').value.trim();
            if (!opName) return alert("Introduce un nombre de operación.");
            localStorage.setItem('dg_op_' + opName, JSON.stringify({ individuals, connections }));
            alert(`[DELTA GREEN] Operación "${opName}" guardada en memoria local del navegador.`);
        }

        function loadOperation() {
            const opName = document.getElementById('op-name').value.trim();
            if (!opName) return;
            if (localStorage.getItem('dg_op_' + opName)) {
                initBoard();
                alert(`[DELTA GREEN] Operación "${opName}" cargada correctamente.`);
            } else {
                alert(`No se encontró registro local para "${opName}".`);
            }
        }

        window.onload = initBoard;
    </script>
</body>
</html>
