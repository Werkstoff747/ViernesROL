<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DELTA GREEN // THE PROGRAM - OPERATION BOARD</title>
    <!-- Google Fonts para tipografía manuscrita de los Post-its -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --dg-bg: #0b120e;
            --dg-panel: #111a14;
            --dg-border: #1e3324;
            --dg-green: #33ff66;
            --dg-dim-green: #1a8c3e;
            --dg-alert: #ff3333;
            --polaroid-bg: #e6e2d3;
            --shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--dg-bg);
            user-select: none;
        }

        #top-classification {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: #000;
            color: var(--dg-alert);
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 3px;
            padding: 4px 0;
            z-index: 1001;
            border-bottom: 1px solid #400;
            box-shadow: 0 2px 10px rgba(255,0,0,0.2);
        }

        #toolbar {
            position: absolute;
            top: 28px;
            left: 15px;
            z-index: 1000;
            background: rgba(11, 18, 14, 0.95);
            padding: 10px 15px;
            border-radius: 3px;
            border: 1px solid var(--dg-dim-green);
            color: var(--dg-green);
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
            flex-wrap: wrap;
        }

        #toolbar button, #toolbar label, #toolbar input[type="text"], #toolbar select {
            background: #142218;
            color: var(--dg-green);
            border: 1px solid var(--dg-dim-green);
            padding: 6px 10px;
            border-radius: 2px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
            box-shadow: inset 0 0 5px rgba(51,255,102,0.1);
        }

        #toolbar input[type="text"], #toolbar select {
            background: #050a07;
            cursor: text;
            width: 130px;
            color: #ffcc00;
            letter-spacing: 1px;
            border-color: #554400;
        }

        #toolbar select {
            cursor: pointer;
        }

        #toolbar button:hover, #toolbar label:hover {
            background: var(--dg-dim-green);
            color: #fff;
        }

        /* Estilos de los Fondos del Tablero */
        #board {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: grab;
            transition: background 0.3s ease;
        }

        #board:active {
            cursor: grabbing;
        }

        #board.cork {
            background-color: #b8865c;
            background-image: none;
        }

        #board.whiteboard {
            background-color: #f4f6f8;
            background-image: 
                linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 35px 35px;
        }

        .board-container {
            position: absolute;
            width: 6000px;
            height: 6000px;
            transform-origin: 0 0;
        }

        #string-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 6000px;
            height: 6000px;
            pointer-events: none;
            z-index: 10;
        }

        /* Fichas Polaroid */
        .individual-card {
            position: absolute;
            width: 250px;
            background: var(--polaroid-bg);
            padding: 10px 10px 15px 10px;
            box-shadow: var(--shadow);
            border-radius: 2px;
            transition: box-shadow 0.2s ease;
            z-index: 20;
            border: 1px solid #b5aca0;
        }

        .individual-card:hover {
            z-index: 100;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }

        /* Notas Post-it */
        .note-card {
            position: absolute;
            width: 220px;
            min-height: 160px;
            padding: 15px 15px 20px 15px;
            box-shadow: var(--shadow);
            border-radius: 2px;
            z-index: 20;
            font-family: 'Caveat', cursive, monospace;
            font-size: 20px;
            line-height: 1.3;
            box-sizing: border-box;
            transition: box-shadow 0.2s ease;
        }

        .note-card:hover {
            z-index: 100;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }

        .note-card.yellow { background: #fff7b1; color: #222; border-bottom: 3px solid #e6dc85; }
        .note-card.pink { background: #ffd1dc; color: #222; border-bottom: 3px solid #e2b0bc; }
        .note-card.green { background: #d4edbc; color: #222; border-bottom: 3px solid #b2cc99; }
        .note-card.blue { background: #cce5ff; color: #222; border-bottom: 3px solid #a8c7e6; }

        .note-text {
            word-break: break-word;
            white-space: pre-wrap;
            margin-top: 10px;
        }

        .pin {
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.7), inset 2px 2px 3px rgba(255,255,255,0.7);
            z-index: 30;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .pin:hover { transform: translateX(-50%) scale(1.2); }
        .pin.red { background: radial-gradient(circle at 30% 30%, #ff4d4d, #800000); }
        .pin.blue { background: radial-gradient(circle at 30% 30%, #4d94ff, #002266); }
        .pin.yellow { background: radial-gradient(circle at 30% 30%, #ffea4d, #998800); }
        
        .pin.pulsing {
            animation: pulse-pin 0.8s infinite alternate;
        }
        @keyframes pulse-pin {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 5px #33ff66; }
            100% { transform: translateX(-50%) scale(1.4); box-shadow: 0 0 15px #33ff66; }
        }

        .card-actions {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 4px;
            z-index: 35;
        }

        .card-action-btn {
            background: #142218;
            color: var(--dg-green);
            border: 1px solid var(--dg-dim-green);
            width: 20px;
            height: 20px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-action-btn.edit:hover { background: var(--dg-dim-green); color: #fff; }
        .card-action-btn.delete { background: #800000; color: #fff; border-color: #500; }
        .card-action-btn.delete:hover { background: #ff3333; }

        .pin-color-selector {
            position: absolute;
            top: 5px;
            left: 5px;
            display: flex;
            gap: 3px;
            z-index: 35;
        }
        .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid #000;
        }
        .color-dot.red { background: #ff4d4d; }
        .color-dot.blue { background: #4d94ff; }
        .color-dot.yellow { background: #ffea4d; }

        .individual-img-container {
            width: 100%;
            height: 200px;
            background: #111;
            overflow: hidden;
            border: 1px solid #555;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 10px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .individual-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(0.4) contrast(1.2) sepia(0.2);
            transition: filter 0.2s;
        }
        .individual-img-container:hover img {
            filter: grayscale(0) contrast(1.1);
        }

        /* Estilo para Silueta Clasificada */
        .classified-silhouette {
            width: 100%;
            height: 100%;
            background: #0a0f0c;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .classified-silhouette svg {
            width: 90px;
            height: 90px;
            fill: #2a3d30;
        }

        .classified-stamp {
            position: absolute;
            background: rgba(180, 0, 0, 0.85);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 4px 10px;
            border: 2px dashed #ff3333;
            transform: rotate(-12deg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            text-shadow: 1px 1px 2px #000;
        }

        .individual-info h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
            font-weight: bold;
            color: #111;
            border-bottom: 1px dashed #999;
            padding-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .individual-role {
            font-size: 12px;
            color: #900;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .individual-desc {
            font-size: 10px;
            color: #222;
            line-height: 1.25;
            max-height: 45px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .mode-indicator {
            font-size: 10px;
            color: #ffcc00;
            font-weight: bold;
        }

        /* Lightbox Pantalla Completa Maximizada */
        #lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 5000;
            justify-content: center;
            align-items: center;
        }

        .lightbox-container {
            position: relative;
            max-width: 96vw;
            max-height: 97vh;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--dg-dim-green);
            box-shadow: 0 0 60px rgba(0,0,0,0.95);
            background: #000;
            overflow: hidden;
            border-radius: 3px;
        }

        .lightbox-container img {
            max-width: 96vw;
            max-height: 95vh;
            object-fit: contain;
            display: block;
        }

        .lightbox-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            padding: 12px 20px;
            box-sizing: border-box;
            border-top: 1px solid var(--dg-dim-green);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .lightbox-caption h2 {
            margin: 0;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.95);
        }

        .lightbox-caption .lb-role {
            color: #ff4d4d;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.95);
        }

        .lightbox-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #800000;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 3px 8px rgba(0,0,0,0.8);
        }
        .lightbox-close:hover { background: #ff3333; }

        /* Modales Generales (Crear/Editar Ficha y Notas) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 5000;
            justify-content: center;
            align-items: center;
        }

        .form-content {
            background: #111a14;
            border: 2px solid var(--dg-dim-green);
            padding: 25px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            width: 400px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: var(--dg-green);
            position: relative;
        }

        .form-content h2 {
            margin: 0 0 5px 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--dg-dim-green);
            padding-bottom: 6px;
            color: #fff;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            color: var(--dg-green);
        }

        .form-group input, .form-group textarea, .form-group select {
            background: #050a07;
            border: 1px solid var(--dg-dim-green);
            color: #ffcc00;
            padding: 8px;
            font-family: inherit;
            font-size: 12px;
            border-radius: 2px;
        }

        .form-group textarea {
            resize: vertical;
            height: 70px;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--dg-green);
        }

        .form-group.checkbox-row {
            flex-direction: row;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .form-group.checkbox-row input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .form-actions button {
            background: #142218;
            color: var(--dg-green);
            border: 1px solid var(--dg-dim-green);
            padding: 8px 14px;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 2px;
        }

        .form-actions button:hover {
            background: var(--dg-dim-green);
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="top-classification">EYES ONLY // THE PROGRAM // AUTHORIZED DELTA GREEN AGENTS ONLY // CLASSIFIED TOP SECRET</div>

    <div id="toolbar">
        <div>
            <label>OP:</label>
            <input type="text" id="op-name" value="OPERATION-STYX">
        </div>
        <div>
            <label>Fondo:</label>
            <select id="board-bg-select" onchange="changeBackground(this.value)">
                <option value="cork">Corcho</option>
                <option value="whiteboard">Pizarra Blanca</option>
            </select>
        </div>
        <button onclick="saveOperation()">💾 Guardar</button>
        <button onclick="loadOperation()">📂 Cargar</button>
        <button onclick="exportJSON()">📤 Exportar JSON</button>
        <button onclick="triggerImportJSON()">📥 Importar JSON</button>
        <input type="file" id="import-json-input" accept=".json" style="display:none" onchange="importJSON(event)">
        <button onclick="toggleMode()">Modo: <span id="mode-name">Mover</span></button>
        <button onclick="addNewCard()">➕ Añadir Ficha</button>
        <button onclick="addNewNote()">➕ Añadir Nota</button>
        <button onclick="clearConnections()">Limpiar</button>
        <span class="mode-indicator" id="instruction-text">Arrastra / Zoom rueda</span>
    </div>

    <div id="board" class="cork">
        <div class="board-container" id="board-container">
            <canvas id="string-canvas" width="6000" height="6000"></canvas>
        </div>
    </div>

    <!-- Lightbox Pantalla Completa -->
    <div id="lightbox-modal" onclick="if(event.target === this) closeLightbox()">
        <div class="lightbox-container">
            <button class="lightbox-close" onclick="closeLightbox()">✕</button>
            <img id="lb-img" src="" alt="Dossier Ampliado">
            <div class="lightbox-caption">
                <h2 id="lb-name"></h2>
                <div id="lb-role" class="lb-role"></div>
            </div>
        </div>
    </div>

    <!-- Form Modal (Crear / Editar Ficha) -->
    <div id="form-modal" class="modal-overlay" onclick="if(event.target === this) closeFormModal()">
        <div class="form-content">
            <h2 id="form-modal-title">NUEVO EXPEDIENTE DE INTELIGENCIA</h2>
            <input type="hidden" id="form-card-id">
            <div class="form-group">
                <label>URL Imagen:</label>
                <input type="text" id="form-img" placeholder="https://ejemplo.com/foto.jpg">
            </div>
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="form-name" placeholder="Nombre completo del sujeto">
            </div>
            <div class="form-group">
                <label>Cargo / Entidad:</label>
                <input type="text" id="form-role" placeholder="Ej. MÉDICO FORENSE / TESTIGO">
            </div>
            <div class="form-group">
                <label>Descripción / Notas:</label>
                <textarea id="form-desc" placeholder="Notas de inteligencia clasificada..."></textarea>
            </div>
            <div class="form-group checkbox-row" onclick="document.getElementById('form-classified').click()">
                <input type="checkbox" id="form-classified" onclick="event.stopPropagation()">
                <label for="form-classified" style="cursor: pointer;">Oculto / Clasificado (Mostrar como Sujeto A, B...)</label>
            </div>
            <div class="form-actions">
                <button type="button" onclick="closeFormModal()">Cancelar</button>
                <button type="button" onclick="submitCardForm()">Guardar Ficha</button>
            </div>
        </div>
    </div>

    <!-- Note Modal (Crear / Editar Nota Post-it) -->
    <div id="note-modal" class="modal-overlay" onclick="if(event.target === this) closeNoteModal()">
        <div class="form-content">
            <h2 id="note-modal-title">NOTA POST-IT</h2>
            <input type="hidden" id="form-note-id">
            <div class="form-group">
                <label>Color:</label>
                <select id="form-note-color">
                    <option value="yellow">Amarillo Clásico</option>
                    <option value="pink">Rosa Alerta</option>
                    <option value="green">Verde Archivo</option>
                    <option value="blue">Azul Expediente</option>
                </select>
            </div>
            <div class="form-group">
                <label>Texto de la Nota:</label>
                <textarea id="form-note-text" style="height: 100px; font-family: 'Caveat', cursive; font-size: 18px;" placeholder="Escribe tu nota manuscrita..."></textarea>
            </div>
            <div class="form-actions">
                <button type="button" onclick="closeNoteModal()">Cancelar</button>
                <button type="button" onclick="submitNoteForm()">Guardar Nota</button>
            </div>
        </div>
    </div>

    <script>
        let individuals = [];
        let notes = [];
        let connections = []; 
        let currentBg = 'cork';
        let mode = 'move'; 
        let connectingSource = null;

        let panX = 100;
        let panY = 80;
        let scale = 1;
        let isPanning = false;
        let startPanX, startPanY;

        const board = document.getElementById('board');
        const container = document.getElementById('board-container');

        function updateTransform() {
            container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        board.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            let oldScale = scale;

            if (e.deltaY < 0) {
                scale += zoomIntensity;
            } else {
                scale -= zoomIntensity;
            }

            scale = Math.max(0.3, Math.min(2.5, scale));

            const rect = board.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            panX = mouseX - (mouseX - panX) * (scale / oldScale);
            panY = mouseY - (mouseY - panY) * (scale / oldScale);

            updateTransform();
        }, { passive: false });

        board.addEventListener('mousedown', (e) => {
            if (e.target === board || e.target === document.getElementById('string-canvas') || e.target === container) {
                isPanning = true;
                startPanX = e.clientX - panX;
                startPanY = e.clientY - panY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startPanX;
                panY = e.clientY - startPanY;
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
        });

        function changeBackground(type) {
            currentBg = type;
            board.className = type;
        }

        function initBoard() {
            const currentOp = document.getElementById('op-name').value;
            const savedData = localStorage.getItem('dg_op_' + currentOp);
            
            if (savedData) {
                const parsed = JSON.parse(savedData);
                individuals = parsed.individuals || parsed.suspects || [];
                notes = parsed.notes || [];
                connections = parsed.connections || [];
                currentBg = parsed.bg || 'cork';
            } else {
                individuals = [
                    { id: 1, name: "Dr. Victor March", role: "MÉDICO FORENSE", desc: "Realizó la autopsia no oficial en OMAHA. Muy nervioso.", x: 250, y: 150, pin: "red", img: "", classified: false },
                    { id: 2, name: "Sujeto X (Anónimo)", role: "TESTIGO CLAVE", desc: "Visto huir del almacén abandonado.", x: 580, y: 200, pin: "blue", img: "", classified: true }
                ];
                notes = [
                    { id: 'n1', text: "Revisar los informes forenses de Omaha antes del viernes.", color: "yellow", x: 280, y: 420, pin: "yellow" }
                ];
                connections = [{ from: 1, to: 2 }];
                currentBg = 'cork';
            }
            
            document.getElementById('board-bg-select').value = currentBg;
            changeBackground(currentBg);
            updateTransform();
            renderBoard();
            drawStrings();
        }

        function findItem(id) {
            return individuals.find(i => i.id === id) || notes.find(n => n.id === id);
        }

        function renderBoard() {
            document.querySelectorAll('.individual-card, .note-card').forEach(el => el.remove());

            // 1. Renderizar Fichas Polaroid
            individuals.forEach((ind, index) => {
                const card = document.createElement('div');
                card.className = 'individual-card';
                card.style.left = ind.x + 'px';
                card.style.top = ind.y + 'px';
                card.dataset.id = ind.id;

                const isPulsing = (connectingSource === ind.id) ? 'pulsing' : '';
                const letter = String.fromCharCode(65 + index);
                
                const displayName = ind.classified ? `Sujeto ${letter}` : escapeHTML(ind.name);
                const displayRole = ind.classified ? "CLASIFICADO // PROGRAMA" : escapeHTML(ind.role);
                const displayDesc = ind.classified ? "[ INFORMACIÓN RESTRINGIDA - ACCESO DENEGADO ]" : escapeHTML(ind.desc);

                let imgContent = '';
                if (ind.classified) {
                    imgContent = `
                        <div class="classified-silhouette">
                            <div class="classified-stamp">TOP SECRET</div>
                            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        </div>
                    `;
                } else {
                    imgContent = ind.img ? `<img src="${ind.img}" alt="Dossier">` : '<span>[ FOTO RETRATO - SIN IMAGEN ]</span>';
                }

                card.innerHTML = `
                    <div class="pin-color-selector">
                        <div class="color-dot red" onclick="setPinColor(${ind.id}, 'red')" title="Chincheta Roja"></div>
                        <div class="color-dot blue" onclick="setPinColor(${ind.id}, 'blue')" title="Chincheta Azul"></div>
                        <div class="color-dot yellow" onclick="setPinColor(${ind.id}, 'yellow')" title="Chincheta Amarilla"></div>
                    </div>
                    <div class="card-actions">
                        <button class="card-action-btn" onclick="toggleClassified(${ind.id})" title="${ind.classified ? 'Revelar sujeto' : 'Ocultar sujeto'}">${ind.classified ? '👁️' : '🔒'}</button>
                        <button class="card-action-btn edit" onclick="openEditModal(${ind.id})" title="Editar Ficha">✏️</button>
                        <button class="card-action-btn delete" onclick="deleteCard(${ind.id})" title="Eliminar expediente">✕</button>
                    </div>
                    <div class="pin ${ind.pin || 'red'} ${isPulsing}" onclick="handlePinClick(event, ${ind.id})" title="Clic para tender/cortar hilo"></div>
                    
                    <div class="individual-img-container" ${!ind.classified ? `onclick="openLightbox(${ind.id})"` : ''} title="${ind.classified ? 'Sujeto clasificado' : 'Clic para ampliar foto'}">
                        ${imgContent}
                    </div>

                    <div class="individual-info">
                        <h3>${displayName}</h3>
                        <div class="individual-role">${displayRole}</div>
                        <div class="individual-desc">${displayDesc}</div>
                    </div>
                `;

                let isDraggingCard = false;
                let startX, startY;

                card.addEventListener('mousedown', (e) => {
                    if (mode !== 'move' || e.target.tagName === 'BUTTON' || e.target.classList.contains('card-action-btn') || e.target.classList.contains('pin') || e.target.classList.contains('color-dot') || e.target.classList.contains('individual-img-container') || e.target.tagName === 'IMG' || e.target.tagName === 'svg' || e.target.tagName === 'path') return;
                    isDraggingCard = true;
                    startX = (e.clientX - panX) / scale - ind.x;
                    startY = (e.clientY - panY) / scale - ind.y;
                    card.style.zIndex = 1000;
                    e.stopPropagation();
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDraggingCard) return;
                    ind.x = (e.clientX - panX) / scale - startX;
                    ind.y = (e.clientY - panY) / scale - startY;
                    card.style.left = ind.x + 'px';
                    card.style.top = ind.y + 'px';
                    drawStrings();
                });

                window.addEventListener('mouseup', () => {
                    isDraggingCard = false;
                });

                container.appendChild(card);
            });

            // 2. Renderizar Notas Post-it
            notes.forEach(note => {
                const noteEl = document.createElement('div');
                noteEl.className = `note-card ${note.color || 'yellow'}`;
                noteEl.style.left = note.x + 'px';
                noteEl.style.top = note.y + 'px';
                noteEl.dataset.id = note.id;

                const isPulsing = (connectingSource === note.id) ? 'pulsing' : '';

                noteEl.innerHTML = `
                    <div class="card-actions">
                        <button class="card-action-btn edit" onclick="openEditNoteModal('${note.id}')" title="Editar Nota">✏️</button>
                        <button class="card-action-btn delete" onclick="deleteNote('${note.id}')" title="Eliminar Nota">✕</button>
                    </div>
                    <div class="pin ${note.pin || 'yellow'} ${isPulsing}" onclick="handlePinClick(event, '${note.id}')" title="Clic para tender/cortar hilo"></div>
                    <div class="note-text">${escapeHTML(note.text)}</div>
                `;

                let isDraggingNote = false;
                let startX, startY;

                noteEl.addEventListener('mousedown', (e) => {
                    if (mode !== 'move' || e.target.tagName === 'BUTTON' || e.target.classList.contains('card-action-btn') || e.target.classList.contains('pin')) return;
                    isDraggingNote = true;
                    startX = (e.clientX - panX) / scale - note.x;
                    startY = (e.clientY - panY) / scale - note.y;
                    noteEl.style.zIndex = 1000;
                    e.stopPropagation();
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDraggingNote) return;
                    note.x = (e.clientX - panX) / scale - startX;
                    note.y = (e.clientY - panY) / scale - startY;
                    noteEl.style.left = note.x + 'px';
                    noteEl.style.top = note.y + 'px';
                    drawStrings();
                });

                window.addEventListener('mouseup', () => {
                    isDraggingNote = false;
                });

                container.appendChild(noteEl);
            });
        }

        function escapeHTML(str) {
            return (str || "").replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function toggleClassified(id) {
            const item = individuals.find(i => i.id === id);
            if (item) {
                item.classified = !item.classified;
                renderBoard();
            }
        }

        function openLightbox(id) {
            const item = individuals.find(i => i.id === id);
            if (!item || !item.img || item.classified) {
                return;
            }
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lb-img');
            const name = document.getElementById('lb-name');
            const role = document.getElementById('lb-role');

            img.src = item.img;
            name.innerText = item.name || "SIN NOMBRE";
            role.innerText = item.role || "SIN CARGO / ROL";
            modal.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').style.display = 'none';
        }

        function addNewCard() {
            document.getElementById('form-modal-title').innerText = "NUEVO EXPEDIENTE DE INTELIGENCIA";
            document.getElementById('form-card-id').value = "";
            document.getElementById('form-img').value = "";
            document.getElementById('form-name').value = "";
            document.getElementById('form-role').value = "";
            document.getElementById('form-desc').value = "";
            document.getElementById('form-classified').checked = false;
            document.getElementById('form-modal').style.display = 'flex';
        }

        function openEditModal(id) {
            const item = individuals.find(i => i.id === id);
            if (!item) return;
            document.getElementById('form-modal-title').innerText = "EDITAR EXPEDIENTE";
            document.getElementById('form-card-id').value = item.id;
            document.getElementById('form-img').value = item.img || "";
            document.getElementById('form-name').value = item.name || "";
            document.getElementById('form-role').value = item.role || "";
            document.getElementById('form-desc').value = item.desc || "";
            document.getElementById('form-classified').checked = !!item.classified;
            document.getElementById('form-modal').style.display = 'flex';
        }

        function closeFormModal() {
            document.getElementById('form-modal').style.display = 'none';
        }

        function submitCardForm() {
            const cardId = document.getElementById('form-card-id').value;
            const imgVal = document.getElementById('form-img').value.trim();
            const nameVal = document.getElementById('form-name').value.trim() || "EXPEDIENTE SIN NOMBRE";
            const roleVal = document.getElementById('form-role').value.trim() || "CONTACTO";
            const descVal = document.getElementById('form-desc').value.trim();
            const classifiedVal = document.getElementById('form-classified').checked;

            if (cardId === "") {
                const newId = individuals.length > 0 ? Math.max(...individuals.map(i => i.id)) + 1 : 1;
                const centerX = (-panX + window.innerWidth / 2) / scale;
                const centerY = (-panY + window.innerHeight / 2) / scale;

                individuals.push({
                    id: newId,
                    name: nameVal,
                    role: roleVal,
                    desc: descVal,
                    x: centerX - 125,
                    y: centerY - 150,
                    pin: "red",
                    img: imgVal,
                    classified: classifiedVal
                });
            } else {
                const item = individuals.find(i => i.id == cardId);
                if (item) {
                    item.img = imgVal;
                    item.name = nameVal;
                    item.role = roleVal;
                    item.desc = descVal;
                    item.classified = classifiedVal;
                }
            }

            closeFormModal();
            renderBoard();
            drawStrings();
        }

        function addNewNote() {
            document.getElementById('note-modal-title').innerText = "NUEVA NOTA POST-IT";
            document.getElementById('form-note-id').value = "";
            document.getElementById('form-note-color').value = "yellow";
            document.getElementById('form-note-text').value = "";
            document.getElementById('note-modal').style.display = 'flex';
        }

        function openEditNoteModal(id) {
            const note = notes.find(n => n.id == id);
            if (!note) return;
            document.getElementById('note-modal-title').innerText = "EDITAR NOTA POST-IT";
            document.getElementById('form-note-id').value = note.id;
            document.getElementById('form-note-color').value = note.color || "yellow";
            document.getElementById('form-note-text').value = note.text || "";
            document.getElementById('note-modal').style.display = 'flex';
        }

        function closeNoteModal() {
            document.getElementById('note-modal').style.display = 'none';
        }

        function submitNoteForm() {
            const noteId = document.getElementById('form-note-id').value;
            const colorVal = document.getElementById('form-note-color').value;
            const textVal = document.getElementById('form-note-text').value.trim() || "Nota sin texto...";

            if (noteId === "") {
                const newId = 'n_' + Date.now();
                const centerX = (-panX + window.innerWidth / 2) / scale;
                const centerY = (-panY + window.innerHeight / 2) / scale;

                notes.push({
                    id: newId,
                    text: textVal,
                    color: colorVal,
                    x: centerX - 110,
                    y: centerY - 80,
                    pin: "yellow"
                });
            } else {
                const note = notes.find(n => n.id == noteId);
                if (note) {
                    note.color = colorVal;
                    note.text = textVal;
                }
            }

            closeNoteModal();
            renderBoard();
            drawStrings();
        }

        function deleteNote(id) {
            if (confirm("¿Descartar esta nota post-it?")) {
                notes = notes.filter(n => n.id != id);
                connections = connections.filter(c => c.from != id && c.to != id);
                renderBoard();
                drawStrings();
            }
        }

        function setPinColor(id, color) {
            const item = findItem(id);
            if (item) {
                item.pin = color;
                renderBoard();
            }
        }

        function deleteCard(id) {
            if (confirm("¿Destruir este expediente de inteligencia?")) {
                individuals = individuals.filter(i => i.id !== id);
                connections = connections.filter(c => c.from !== id && c.to !== id);
                renderBoard();
                drawStrings();
            }
        }

        function drawStrings() {
            const canvas = document.getElementById('string-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#b22222'; 
            ctx.lineWidth = 2.5;
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 6;

            connections.forEach(conn => {
                const fromItem = findItem(conn.from);
                const toItem = findItem(conn.to);

                if (fromItem && toItem) {
                    const widthFrom = fromItem.text !== undefined ? 220 : 250;
                    const widthTo = toItem.text !== undefined ? 220 : 250;
                    
                    const x1 = fromItem.x + (widthFrom / 2); 
                    const y1 = fromItem.y + 10;
                    const x2 = toItem.x + (widthTo / 2);
                    const y2 = toItem.y + 10;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    let cx = (x1 + x2) / 2 + 10;
                    let cy = (y1 + y2) / 2 + 10;
                    ctx.quadraticCurveTo(cx, cy, x2, y2);
                    ctx.stroke();
                }
            });
        }

        function toggleMode() {
            if (mode === 'move') {
                mode = 'connect';
                document.getElementById('mode-name').innerText = 'Conectar / Cortar Hilo';
                document.getElementById('instruction-text').innerText = 'Haz clic en dos chinchetas para tender hilo, o haz clic en un hilo existente para cortarlo.';
            } else {
                mode = 'move';
                document.getElementById('mode-name').innerText = 'Mover';
                document.getElementById('instruction-text').innerText = 'Arrastra / Zoom rueda';
                connectingSource = null;
                renderBoard();
            }
        }

        function handlePinClick(e, id) {
            if (mode === 'connect') {
                e.stopPropagation();
                if (connectingSource === null) {
                    connectingSource = id;
                    renderBoard();
                } else {
                    if (connectingSource !== id) {
                        const exists = connections.some(c => (c.from === connectingSource && c.to === id) || (c.from === id && c.to === connectingSource));
                        if (!exists) {
                            connections.push({ from: connectingSource, to: id });
                        }
                    }
                    connectingSource = null;
                    renderBoard();
                    drawStrings();
                }
            }
        }

        document.getElementById('board').addEventListener('click', (e) => {
            if (mode === 'connect' && (e.target === document.getElementById('string-canvas') || e.target === container)) {
                const rect = container.getBoundingClientRect();
                const clickX = (e.clientX - rect.left) / scale;
                const clickY = (e.clientY - rect.top) / scale;

                for (let i = connections.length - 1; i >= 0; i--) {
                    const conn = connections[i];
                    const fromItem = findItem(conn.from);
                    const toItem = findItem(conn.to);
                    if (fromItem && toItem) {
                        const widthFrom = fromItem.text !== undefined ? 220 : 250;
                        const widthTo = toItem.text !== undefined ? 220 : 250;
                        const x1 = fromItem.x + (widthFrom / 2), y1 = fromItem.y + 10;
                        const x2 = toItem.x + (widthTo / 2), y2 = toItem.y + 10;
                        const midX = (x1 + x2) / 2 + 10;
                        const midY = (y1 + y2) / 2 + 10;
                        
                        const dist = Math.hypot(clickX - midX, clickY - midY);
                        if (dist < 30) {
                            if (confirm("¿Cortar este hilo de investigación?")) {
                                connections.splice(i, 1);
                                drawStrings();
                                break;
                            }
                        }
                    }
                }
            }
        });

        function clearConnections() {
            if (confirm("¿Desconectar todos los hilos de inteligencia del tablero?")) {
                connections = [];
                drawStrings();
            }
        }

        function saveOperation() {
            const opName = document.getElementById('op-name').value.trim();
            if (!opName) return alert("Introduce un nombre de operación.");
            localStorage.setItem('dg_op_' + opName, JSON.stringify({ individuals, notes, connections, bg: currentBg }));
            alert(`[DELTA GREEN] Operación "${opName}" guardada en memoria local del navegador.`);
        }

        function loadOperation() {
            const opName = document.getElementById('op-name').value.trim();
            if (!opName) return;
            if (localStorage.getItem('dg_op_' + opName)) {
                initBoard();
                alert(`[DELTA GREEN] Operación "${opName}" cargada correctamente.`);
            } else {
                alert(`No se encontró registro local para "${opName}".`);
            }
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ individuals, notes, connections, bg: currentBg }, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            const opName = document.getElementById('op-name').value.trim() || "operation-board";
            downloadAnchor.setAttribute("download", opName + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImportJSON() {
            document.getElementById('import-json-input').click();
        }

        function importJSON(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = function(e) {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.individuals && Array.isArray(parsed.individuals)) {
                            individuals = parsed.individuals;
                            notes = parsed.notes || [];
                            connections = parsed.connections || [];
                            currentBg = parsed.bg || 'cork';
                            document.getElementById('board-bg-select').value = currentBg;
                            changeBackground(currentBg);
                            renderBoard();
                            drawStrings();
                            alert("[DELTA GREEN] Tablero importado correctamente desde JSON.");
                        } else {
                            alert("El archivo JSON no tiene el formato válido de operación.");
                        }
                    } catch (error) {
                        alert("Error al parsear el archivo JSON.");
                    }
                };
            }
        }

        window.onload = initBoard;
    </script>
</body>
</html>
