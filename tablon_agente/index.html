<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DELTA GREEN // THE PROGRAM - OPERATION BOARD</title>
    <!-- SheetJS para importación opcional -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --dg-bg: #0b120e;
            --dg-panel: #111a14;
            --dg-border: #1e3324;
            --dg-green: #33ff66;
            --dg-dim-green: #1a8c3e;
            --dg-alert: #ff3333;
            --polaroid-bg: #e6e2d3;
            --shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--dg-bg);
        }

        /* Cabecera Clasificada Delta Green */
        #top-classification {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: #000;
            color: var(--dg-alert);
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 3px;
            padding: 4px 0;
            z-index: 1001;
            border-bottom: 1px solid #400;
            box-shadow: 0 2px 10px rgba(255,0,0,0.2);
        }

        #toolbar {
            position: absolute;
            top: 28px;
            left: 15px;
            z-index: 1000;
            background: rgba(11, 18, 14, 0.95);
            padding: 10px 15px;
            border-radius: 3px;
            border: 1px solid var(--dg-dim-green);
            color: var(--dg-green);
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
            flex-wrap: wrap;
        }

        #toolbar button, #toolbar label, #toolbar input[type="text"] {
            background: #142218;
            color: var(--dg-green);
            border: 1px solid var(--dg-dim-green);
            padding: 6px 12px;
            border-radius: 2px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            box-shadow: inset 0 0 5px rgba(51,255,102,0.1);
        }

        #toolbar input[type="text"] {
            background: #050a07;
            cursor: text;
            width: 160px;
            color: #ffcc00;
            letter-spacing: 1px;
            border-color: #554400;
        }

        #toolbar button:hover, #toolbar label:hover {
            background: var(--dg-dim-green);
            color: #fff;
        }

        #toolbar input[type="file"] {
            display: none;
        }

        #board {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #1a261e;
            background-image: radial-gradient(rgba(51,255,102,0.05) 15%, transparent 16%),
                              radial-gradient(rgba(0,0,0,0.4) 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            overflow: auto;
            cursor: grab;
        }

        #board:active {
            cursor: grabbing;
        }

        #string-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 6000px;
            height: 6000px;
            pointer-events: none;
            z-index: 10;
        }

        .board-container {
            position: absolute;
            width: 6000px;
            height: 6000px;
        }

        /* Ficha de Expediente de Individuo (Estilo Delta Green / Dossier) */
        .individual-card {
            position: absolute;
            width: 230px;
            background: var(--polaroid-bg);
            padding: 10px 10px 15px 10px;
            box-shadow: var(--shadow);
            border-radius: 2px;
            transform: rotate(-0.5deg);
            transition: box-shadow 0.2s ease;
            z-index: 20;
            user-select: none;
            border: 1px solid #b5aca0;
        }

        .individual-card:hover {
            z-index: 100;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }

        .pin {
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.7), inset 2px 2px 3px rgba(255,255,255,0.7);
            z-index: 30;
            cursor: pointer;
        }
        .pin.red { background: radial-gradient(circle at 30% 30%, #ff4d4d, #800000); }
        .pin.blue { background: radial-gradient(circle at 30% 30%, #4d94ff, #002266); }
        .pin.yellow { background: radial-gradient(circle at 30% 30%, #ffea4d, #998800); }

        .individual-img-container {
            width: 100%;
            height: 140px;
            background: #111;
            overflow: hidden;
            border: 1px solid #555;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 10px;
            text-align: center;
            cursor: pointer;
        }

        .individual-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(0.4) contrast(1.2) sepia(0.2);
        }

        .editable-field {
            border: 1px dashed transparent;
            background: transparent;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
            color: inherit;
        }

        .editable-field:hover, .editable-field:focus {
            border-color: #800;
            background: rgba(255,255,255,0.85);
            outline: none;
        }

        .individual-info h3 input {
            font-size: 13px;
            font-weight: bold;
            color: #111;
            border-bottom: 1px dashed #999;
            margin-bottom: 4px;
        }

        .individual-role input {
            font-size: 10px;
            color: #900;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .individual-desc textarea {
            font-size: 10px;
            color: #222;
            line-height: 1.25;
            resize: vertical;
            height: 45px;
            background: transparent;
        }

        .mode-indicator {
            font-size: 11px;
            color: #ffcc00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="top-classification">EYES ONLY // THE PROGRAM // AUTHORIZED DELTA GREEN AGENTS ONLY // CLASSIFIED TOP SECRET</div>

    <div id="toolbar">
        <div>
            <label>OPERACIÓN:</label>
            <input type="text" id="op-name" value="OPERATION-STYX">
        </div>
        <button onclick="saveOperation()">💾 Guardar Op.</button>
        <button onclick="loadOperation()">📂 Cargar Op.</button>
        <button onclick="toggleMode()">Modo: <span id="mode-name">Mover</span></button>
        <button onclick="addNewCard()">➕ Añadir Individuo</button>
        <button onclick="clearConnections()">Limpiar Hilos</button>
        <span class="mode-indicator" id="instruction-text">Tablero listo.</span>
    </div>

    <div id="board">
        <div class="board-container" id="board-container">
            <canvas id="string-canvas" width="6000" height="6000"></canvas>
        </div>
    </div>

    <script>
        let individuals = [];
        let connections = []; 
        let mode = 'move'; 
        let connectingSource = null;

        function initBoard() {
            const currentOp = document.getElementById('op-name').value;
            const savedData = localStorage.getItem('dg_op_' + currentOp);
            
            if (savedData) {
                const parsed = JSON.parse(savedData);
                individuals = parsed.individuals || parsed.suspects || [];
                connections = parsed.connections || [];
            } else {
                individuals = [
                    { id: 1, name: "Dr. Victor March", role: "MÉDICO FORENSE", desc: "Realizó la autopsia no oficial en OMAHA. Muy nervioso.", x: 250, y: 150, pin: "red", img: "" },
                    { id: 2, name: "Sarah Miller", role: "ESPOSA (VÍNCULO)", desc: "Empieza a sospecher de las ausencias prolongadas del agente.", x: 550, y: 200, pin: "blue", img: "" }
                ];
                connections = [{ from: 1, to: 2 }];
            }
            renderBoard();
            drawStrings();
        }

        function renderBoard() {
            const container = document.getElementById('board-container');
            const canvas = document.getElementById('string-canvas');
            container.innerHTML = '';
            container.appendChild(canvas);

            individuals.forEach(ind => {
                const card = document.createElement('div');
                card.className = 'individual-card';
                card.style.left = ind.x + 'px';
                card.style.top = ind.y + 'px';
                card.dataset.id = ind.id;

                card.innerHTML = `
                    <div class="pin ${ind.pin || 'red'}" onclick="handlePinClick(event, ${ind.id})" title="Clic para tender hilo rojo"></div>
                    <div class="individual-img-container" onclick="changeImage(${ind.id})" title="Clic para añadir URL de foto">
                        ${ind.img ? `<img src="${ind.img}" alt="Dossier">` : '<span>[ FOTO - AÑADIR URL ]</span>'}
                    </div>
                    <div class="individual-info">
                        <h3><input type="text" class="editable-field" value="${ind.name}" onchange="updateField(${ind.id}, 'name', this.value)"></h3>
                        <div class="individual-role"><input type="text" class="editable-field" value="${ind.role}" onchange="updateField(${ind.id}, 'role', this.value)"></div>
                        <div class="individual-desc"><textarea class="editable-field" onchange="updateField(${ind.id}, 'desc', this.value)">${ind.desc}</textarea></div>
                    </div>
                `;

                let isDragging = false;
                let startX, startY;

                card.addEventListener('mousedown', (e) => {
                    if (mode !== 'move' || e.target.classList.contains('editable-field') || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.classList.contains('pin')) return;
                    isDragging = true;
                    startX = e.clientX - ind.x;
                    startY = e.clientY - ind.y;
                    card.style.zIndex = 1000;
                    e.stopPropagation();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    ind.x = e.clientX - startX;
                    ind.y = e.clientY - startY;
                    card.style.left = ind.x + 'px';
                    card.style.top = ind.y + 'px';
                    drawStrings();
                });

                document.addEventListener('mouseup', () => {
                    isDragging = false;
                });

                container.appendChild(card);
            });
        }

        function updateField(id, field, value) {
            const item = individuals.find(i => i.id === id);
            if (item) item[field] = value;
        }

        function changeImage(id) {
            const item = individuals.find(i => i.id === id);
            const newUrl = prompt("Introduce la URL de la imagen del individuo:", item.img || "");
            if (newUrl !== null) {
                item.img = newUrl;
                renderBoard();
            }
        }

        function addNewCard() {
            const newId = individuals.length > 0 ? Math.max(...individuals.map(i => i.id)) + 1 : 1;
            individuals.push({
                id: newId,
                name: "NUEVO INDIVIDUO",
                role: "CONTACTO / VÍNCULO",
                desc: "Notas de inteligencia...",
                x: 200 + (individuals.length % 5) * 40,
                y: 200 + (individuals.length % 5) * 40,
                pin: "red",
                img: ""
            });
            renderBoard();
        }

        function drawStrings() {
            const canvas = document.getElementById('string-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#b22222'; 
            ctx.lineWidth = 2.5;
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 6;

            connections.forEach(conn => {
                const fromInd = individuals.find(i => i.id === conn.from);
                const toInd = individuals.find(i => i.id === conn.to);

                if (fromInd && toInd) {
                    const x1 = fromInd.x + 115; 
                    const y1 = fromInd.y + 10;
                    const x2 = toInd.x + 115;
                    const y2 = toInd.y + 10;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    let cx = (x1 + x2) / 2 + (Math.random() - 0.5) * 12;
                    let cy = (y1 + y2) / 2 + (Math.random() - 0.5) * 12;
                    ctx.quadraticCurveTo(cx, cy, x2, y2);
                    ctx.stroke();
                }
            });
        }

        function toggleMode() {
            if (mode === 'move') {
                mode = 'connect';
                document.getElementById('mode-name').innerText = 'Conectar';
                document.getElementById('instruction-text').innerText = 'Haz clic en dos chinchetas para tender hilo rojo.';
            } else {
                mode = 'move';
                document.getElementById('mode-name').innerText = 'Mover';
                document.getElementById('instruction-text').innerText = 'Tablero listo.';
                connectingSource = null;
            }
        }

        function handlePinClick(e, id) {
            if (mode === 'connect') {
                e.stopPropagation();
                if (connectingSource === null) {
                    connectingSource = id;
                } else {
                    if (connectingSource !== id) {
                        connections.push({ from: connectingSource, to: id });
                        drawStrings();
                    }
                    connectingSource = null;
                }
            }
        }

        function clearConnections() {
            if (confirm("¿Desconectar todos los hilos de inteligencia?")) {
                connections = [];
                drawStrings();
            }
        }

        function saveOperation() {
            const opName = document.getElementById('op-name').value.trim();
            if (!opName) return alert("Introduce un nombre de operación.");
            localStorage.setItem('dg_op_' + opName, JSON.stringify({ individuals, connections }));
            alert(`[DELTA GREEN] Operación "${opName}" guardada en memoria local.`);
        }

        function loadOperation() {
            const opName = document.getElementById('op-name').value.trim();
            if (!opName) return;
            if (localStorage.getItem('dg_op_' + opName)) {
                initBoard();
                alert(`[DELTA GREEN] Operación "${opName}" cargada correctamente.`);
            } else {
                alert(`No se encontró registro local para "${opName}".`);
            }
        }

        window.onload = initBoard;
    </script>
</body>
</html>
