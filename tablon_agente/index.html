<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los viernes, Rol - Tablero Táctico</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1A2333;
            --card-border: #334155;
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            --accent-gold: #D9A74A;
            --marker-red: #E63946;
            --polaroid-bg: #e6e2d3;
        }

        body.light-mode {
            --bg-color: #D0D2D6;
            --card-bg: #F4F4F6;
            --card-border: #A9AEB6;
            --text-main: #2b2628;
            --text-muted: #6b6366;
            --accent-gold: #9c7326;
            --marker-red: #C52233;
            --polaroid-bg: #f4efe1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); overflow: hidden; transition: background-color 0.3s; }

        /* VISTA 1: ADMIN DASHBOARD */
        #admin-view {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow-y: auto; padding: 40px;
        }

        .dashboard-container {
            max-width: 1000px; width: 100%;
            background: var(--card-bg); border: 2px solid var(--accent-gold);
            border-radius: 12px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .dash-header { text-align: center; border-bottom: 1px solid var(--card-border); padding-bottom: 20px; margin-bottom: 30px; }
        .dash-header h1 { font-family: 'Permanent Marker', cursive; font-size: 3rem; color: var(--marker-red); letter-spacing: 2px; }
        
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        
        .dash-section { background: rgba(0,0,0,0.15); padding: 20px; border-radius: 8px; border: 1px solid var(--card-border); }
        .dash-section h2 { color: var(--accent-gold); font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        .btn-large {
            display: block; width: 100%; padding: 12px; margin-bottom: 10px;
            background: var(--bg-color); color: var(--text-main);
            border: 1px solid var(--card-border); border-radius: 6px;
            font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: all 0.2s;
            text-align: left;
        }
        .btn-large i { width: 25px; text-align: center; margin-right: 10px; color: var(--accent-gold); }
        .btn-large:hover { border-color: var(--accent-gold); transform: translateY(-2px); }

        .guide-table { width: 100%; font-size: 0.9rem; text-align: left; border-collapse: collapse; }
        .guide-table th { color: var(--accent-gold); padding-bottom: 10px; border-bottom: 1px solid var(--card-border); }
        .guide-table td { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .key-badge { background: var(--card-border); padding: 3px 8px; border-radius: 4px; font-family: monospace; font-weight: bold; color: var(--text-main); }

        .start-btn-container { text-align: center; margin-top: 30px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        
        .start-btn {
            background: var(--marker-red); color: white; border: none;
            padding: 15px 30px; font-size: 1.2rem; font-weight: bold; font-family: 'Special Elite', monospace;
            border-radius: 8px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 0 #990000; letter-spacing: 1px;
        }
        .start-btn.tv-btn { background: #1a8c3e; box-shadow: 0 6px 0 #0f5425; }
        .start-btn.tv-btn:hover { box-shadow: 0 4px 0 #0f5425; }
        .start-btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 #990000; }
        .start-btn:active { transform: translateY(6px); box-shadow: none; }

        /* VISTA 2: TABLÓN INMERSIVO */
        #board-view {
            display: none; position: fixed; inset: 0; width: 100vw; height: 100vh;
            background-color: #b8865c; overflow: hidden; cursor: grab;
        }
        #board-view.whiteboard { background-color: #f4f6f8; background-image: linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px); background-size: 35px 35px; }
        #board-view.drawing-mode { cursor: crosshair; }
        #board-view:active { cursor: grabbing; }

        .board-container { position: absolute; width: 6000px; height: 6000px; transform-origin: 0 0; }
        #string-canvas, #drawing-canvas { position: absolute; top: 0; left: 0; width: 6000px; height: 6000px; pointer-events: none; z-index: 10; }
        #drawing-canvas { z-index: 15; }

        .floating-toolbar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(18, 24, 36, 0.95); border: 1px solid var(--accent-gold);
            padding: 10px 20px; border-radius: 30px; display: flex; gap: 15px; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 1000; backdrop-filter: blur(5px);
        }
        .tool-btn {
            background: transparent; color: var(--text-main); border: none; font-size: 1.1rem;
            cursor: pointer; padding: 8px; border-radius: 50%; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; width: 35px; height: 35px;
        }
        .tool-btn.active, .tool-btn:hover { background: var(--accent-gold); color: #121824; }
        
        .autosave-toast {
            position: absolute; top: 25px; right: 25px; color: var(--accent-gold);
            font-family: 'Special Elite', monospace; font-size: 0.9rem; z-index: 1000;
            opacity: 0; transition: opacity 0.3s;
        }

        /* Fichas y Notas */
        .individual-card { position: absolute; width: 250px; background: var(--polaroid-bg); padding: 10px 10px 15px 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); border-radius: 2px; z-index: 20; border: 1px solid #b5aca0; user-select: none; transition: box-shadow 0.2s; }
        .individual-card.front { z-index: 100; box-shadow: 0 20px 40px rgba(0,0,0,0.9); }
        
        .note-card { position: absolute; width: 220px; min-height: 160px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); border-radius: 2px; z-index: 20; font-family: 'Caveat', cursive; font-size: 22px; line-height: 1.2; user-select: none; }
        .note-card.front { z-index: 100; box-shadow: 0 20px 40px rgba(0,0,0,0.9); }
        .note-card.yellow { background: #fff7b1; color: #222; border-bottom: 3px solid #e6dc85; }
        .note-card.pink { background: #ffd1dc; color: #222; border-bottom: 3px solid #e2b0bc; }
        .note-card.green { background: #d4edbc; color: #222; border-bottom: 3px solid #b2cc99; }
        .note-card.blue { background: #cce5ff; color: #222; border-bottom: 3px solid #a8c7e6; }

        .pin { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 3px 6px rgba(0,0,0,0.7), inset 2px 2px 3px rgba(255,255,255,0.7); z-index: 30; cursor: pointer; transition: transform 0.1s; }
        .pin:hover { transform: translateX(-50%) scale(1.3); }
        .pin.red { background: radial-gradient(circle at 30% 30%, #ff4d4d, #800000); }
        .pin.blue { background: radial-gradient(circle at 30% 30%, #4d94ff, #002266); }
        .pin.yellow { background: radial-gradient(circle at 30% 30%, #ffea4d, #998800); }
        .pin.pulsing { animation: pulse-pin 0.8s infinite alternate; }
        @keyframes pulse-pin {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 5px #33ff66; }
            100% { transform: translateX(-50%) scale(1.4); box-shadow: 0 0 15px #33ff66; }
        }

        .card-actions { position: absolute; top: 5px; right: 5px; display: flex; gap: 4px; z-index: 35; }
        .card-action-btn { background: #142218; color: #33ff66; border: 1px solid #1a8c3e; width: 20px; height: 20px; font-size: 10px; cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .card-action-btn.edit:hover { background: #1a8c3e; color: #fff; }
        .card-action-btn.delete { background: #800000; color: #fff; border-color: #500; }
        .card-action-btn.delete:hover { background: #ff3333; }

        .pin-color-selector { position: absolute; top: 5px; left: 5px; display: flex; gap: 3px; z-index: 35; }
        .color-dot { width: 10px; height: 10px; border-radius: 50%; cursor: pointer; border: 1px solid #000; }
        .color-dot.red { background: #ff4d4d; }
        .color-dot.blue { background: #4d94ff; }
        .color-dot.yellow { background: #ffea4d; }

        .individual-img-container { width: 100%; height: 160px; background: #111; overflow: hidden; border: 1px solid #555; margin-bottom: 8px; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; color: #888; font-size: 10px; }
        .individual-img-container img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.4) contrast(1.2); transition: filter 0.2s; }
        .individual-img-container:hover img { filter: grayscale(0) contrast(1.1); }
        
        .classified-silhouette { width: 100%; height: 100%; background: #0a0f0c; display: flex; align-items: center; justify-content: center; position: relative; }
        .classified-silhouette svg { width: 70px; height: 70px; fill: #2a3d30; }
        .classified-stamp { position: absolute; background: rgba(180, 0, 0, 0.85); color: #fff; font-size: 10px; font-weight: bold; letter-spacing: 2px; padding: 3px 8px; border: 2px dashed #ff3333; transform: rotate(-12deg); box-shadow: 0 2px 8px rgba(0,0,0,0.6); text-shadow: 1px 1px 2px #000; }

        .individual-info h3 { font-size: 14px; font-weight: bold; color: #111; border-bottom: 1px dashed #999; padding-bottom: 3px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .individual-role { font-size: 10px; color: #900; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .individual-desc { font-size: 10px; color: #222; line-height: 1.2; max-height: 40px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }

        .selected-glow { box-shadow: 0 0 0 3px var(--marker-red), 0 10px 25px rgba(0,0,0,0.6) !important; }

        /* Lightbox Pantalla Completa */
        #lightbox-modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 10000; justify-content: center; align-items: center; }
        .lightbox-container { position: relative; max-width: 96vw; max-height: 97vh; display: flex; justify-content: center; align-items: center; border: 2px solid var(--accent-gold); box-shadow: 0 0 60px rgba(0,0,0,0.95); background: #000; overflow: hidden; border-radius: 3px; }
        .lightbox-container img { max-width: 96vw; max-height: 95vh; object-fit: contain; display: block; }
        .lightbox-caption { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); padding: 12px 20px; box-sizing: border-box; border-top: 1px solid var(--accent-gold); display: flex; flex-direction: column; gap: 2px; text-align: left; }
        .lightbox-caption h2 { margin: 0; color: #ffffff; font-size: 20px; font-weight: bold; }
        .lightbox-caption .lb-role { color: #ff4d4d; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; }
        .lightbox-close { position: absolute; top: 12px; right: 12px; background: #800000; color: #fff; border: none; width: 32px; height: 32px; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .lightbox-close:hover { background: #ff3333; }

        /* Modales Generales */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .form-content { background: var(--card-bg); border: 2px solid var(--accent-gold); padding: 25px; width: 400px; max-width: 100%; display: flex; flex-direction: column; gap: 12px; border-radius: 8px; text-align: left; }
        .form-content label { font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; }
        .form-content input, .form-content textarea, .form-content select { background: var(--bg-color); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px; border-radius: 4px; outline: none; }
        .form-content input:focus, .form-content textarea:focus { border-color: var(--accent-gold); }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .form-btn { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--card-border); padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .form-btn.primary { background: var(--accent-gold); color: #000; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <!-- VISTA 1: ADMIN DASHBOARD -->
    <div id="admin-view">
        <div class="dashboard-container">
            <div class="dash-header">
                <span style="font-family: 'Special Elite'; color: var(--text-muted);">Los viernes, Rol present:</span>
                <h1>EL TABLÓN</h1>
            </div>

            <div class="dash-grid">
                <!-- Archivos y Ajustes -->
                <div class="dash-section">
                    <h2><i class="fa-solid fa-folder-open"></i> Gestión de Expediente</h2>
                    <input type="text" id="op-name" value="OPERATION-STYX" style="width: 100%; padding: 10px; margin-bottom: 15px; background: var(--bg-color); color: var(--accent-gold); border: 1px solid var(--card-border); font-family: 'Special Elite';" placeholder="Nombre de la Operación">
                    
                    <button class="btn-large" onclick="exportJSON()"><i class="fa-solid fa-file-export"></i> Exportar a JSON (Copia de seguridad)</button>
                    <button class="btn-large" onclick="document.getElementById('import-json-input').click()"><i class="fa-solid fa-file-import"></i> Importar JSON (Cargar partida)</button>
                    <input type="file" id="import-json-input" accept=".json" style="display:none" onchange="importJSON(event)">
                    
                    <div style="margin-top: 15px;">
                        <label style="font-size: 0.85rem; color: var(--text-muted);">Fondo del Tablón:</label>
                        <select id="board-bg-select" style="width: 100%; padding: 8px; margin-top: 4px; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--card-border);">
                            <option value="cork">Corcho Clásico</option>
                            <option value="whiteboard">Pizarra Blanca</option>
                        </select>
                    </div>
                </div>

                <!-- Guía y Atajos -->
                <div class="dash-section">
                    <h2><i class="fa-solid fa-circle-info"></i> Guía Rápida de Atajos</h2>
                    <table class="guide-table">
                        <tr><th>Acción</th><th>Teclado / Ratón</th></tr>
                        <tr><td>Mover Corcho</td><td><span class="key-badge">Espacio</span> + Arrastrar</td></tr>
                        <tr><td>Herramienta Mover</td><td><span class="key-badge">V</span></td></tr>
                        <tr><td>Conectar/Cortar Hilo</td><td><span class="key-badge">C</span> (Clic en chincheta/hilo)</td></tr>
                        <tr><td>Rotulador Rojo</td><td><span class="key-badge">D</span> + Arrastrar ratón</td></tr>
                        <tr><td>Borrar Seleccionado</td><td><span class="key-badge">Supr</span></td></tr>
                        <tr><td>Zoom</td><td><span class="key-badge">Rueda Ratón</span></td></tr>
                    </table>
                </div>
            </div>

            <div class="start-btn-container">
                <button class="start-btn" onclick="enterBoard()">INICIAR EN ESTA PESTAÑA</button>
                <button class="start-btn tv-btn" onclick="openTVWindow()"><i class="fa-solid fa-tv"></i> ABRIR EN VENTANA SECUNDARIA (TV)</button>
            </div>
        </div>
        
        <button class="form-btn" onclick="document.body.classList.toggle('light-mode')" style="position: absolute; top: 20px; right: 20px;"><i class="fa-solid fa-moon"></i></button>
    </div>

    <!-- VISTA 2: TABLERO INMERSIVO -->
    <div id="board-view" class="cork">
        <div class="autosave-toast" id="autosave-toast"><i class="fa-solid fa-floppy-disk"></i> Sincronizado...</div>
        
        <!-- Barra Flotante -->
        <div class="floating-toolbar">
            <button class="tool-btn active" id="btn-mode-v" onclick="setMode('move')" title="Mover Fichas (V)"><i class="fa-solid fa-arrow-pointer"></i></button>
            <button class="tool-btn" id="btn-mode-c" onclick="setMode('connect')" title="Conectar/Cortar Hilos (C)"><i class="fa-solid fa-circle-nodes"></i></button>
            <button class="tool-btn" id="btn-mode-d" onclick="setMode('draw')" title="Rotulador (D)"><i class="fa-solid fa-pen"></i></button>
            <div style="width: 1px; height: 20px; background: var(--card-border); margin: 0 5px;"></div>
            <button class="tool-btn" onclick="openAddCard()" title="Nueva Ficha (+)"><i class="fa-solid fa-user-plus"></i></button>
            <button class="tool-btn" onclick="openAddNote()" title="Nueva Nota (+)"><i class="fa-solid fa-note-sticky"></i></button>
            <div style="width: 1px; height: 20px; background: var(--card-border); margin: 0 5px;"></div>
            <button class="tool-btn" onclick="toggleFullScreenAPI()" title="Pantalla Completa Real (F11)"><i class="fa-solid fa-expand"></i></button>
            <button class="tool-btn" onclick="exitBoard()" style="color: var(--marker-red);" title="Cerrar / Volver (ESC)"><i class="fa-
